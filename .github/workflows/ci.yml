name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Least privilege by default; jobs that need more ask for it.
permissions:
  contents: read

jobs:
  # The AI Guard Demo Kit core (aiguard/) is stdlib-only. Its tests need only
  # pytest and cryptography (to generate a throw-away test CA); no torch, no app
  # dependencies, no network beyond 127.0.0.1.
  core-tests:
    runs-on: ubuntu-latest
    # The oldest version is informational until it has passed once in CI
    # (the kit targets Python 3.8+ syntax; 3.14 is what it is developed on).
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.12', '3.14' ]
        experimental: [ false ]
        include:
          - python-version: '3.9'
            experimental: true

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install test tools
      run: |
        python -m pip install --upgrade pip
        pip install pytest cryptography

    - name: Run aiguard core tests
      run: python -m pytest tests/core -q

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run tests
      run: |
        pytest tests/ --cov=app --cov-report=xml --cov-report=html

    - name: Upload coverage reports
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  # The sign-in limit counts by client address. Behind the bundled nginx the app
  # must trust exactly one proxy and its port must be on loopback only; without
  # nginx it must trust none. Checks the files and what Docker Compose resolves.
  deploy-config:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check reverse proxy, client address and port settings
      run: |
        docker compose version
        docker compose config --format json > "$RUNNER_TEMP/base.json"
        docker compose -f docker-compose.yml -f docker-compose.prod.yml config --format json > "$RUNNER_TEMP/prod.json"
        python3 scripts/check_deploy_config.py --self-test \
          --base-json "$RUNNER_TEMP/base.json" --prod-json "$RUNNER_TEMP/prod.json"

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Pinned: trivy-action tags were force-pushed to a credential stealer on
    # 19-20 March 2026 (CVE-2026-33634, GHSA-69fq-xp46-6x23). Use 0.35.0 or
    # later and never @master. A reviewed commit SHA is stronger than a tag.
    # scan-type fs scans the checked-out files (the old image-ref '.' was not
    # an image and failed).
    - name: Run Trivy vulnerability scanner (repository files)
      uses: aquasecurity/trivy-action@0.35.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'

  build-and-push:
    runs-on: ubuntu-latest
    needs: [core-tests, test, deploy-config, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Deploy to Production
      run: |
        echo "Deploying to production server..."
        # To configure deployment:
        # 1. Set up SSH secrets (HOST, USERNAME, KEY) in GitHub
        # 2. Use appleboy/ssh-action to connect and run 'docker compose pull && docker compose up -d'
        echo "Deployment step is currently a placeholder. Configure SSH or Self-Hosted runner to enable."
