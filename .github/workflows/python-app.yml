# App and core tests on the newest Python, without the heavy ML dependencies.
# llm-guard (and its torch/transformers stack) does not install on Python 3.13+;
# tests/conftest.py stubs those modules when they are missing, so the Flask app,
# Gateway Mode and the aiguard core are all tested here. The full requirements.txt
# install runs in ci.yml (job "test", Python 3.11).

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install dependencies (no ML stack)
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        pip install Flask Flask-Login Flask-SQLAlchemy Flask-Limiter requests python-dotenv cryptography
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        python -m pytest tests -q
