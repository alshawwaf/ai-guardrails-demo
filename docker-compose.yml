# Full stack: web + Redis + Redis Commander. docker-compose.prod.yml adds the
# Nginx reverse proxy and a daily SQLite backup, and puts the app behind nginx.
#
#   docker compose up -d                                                   # web (port 9000) + Redis + Redis Commander
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d  # + Nginx (port 80) + backup (make prod)
#
# Settings come from .env in this folder (cp .env.example .env). A variable
# listed without "=" below is passed through only when it is set in .env or in
# your shell; otherwise the container does not get it at all.
#
# Gateway Mode (/gateway) keeps each user's management session in the memory of
# ONE app process. The image runs "python app.py" (one process, threaded), which
# is what Gateway Mode needs. Do not scale the web service beyond one replica.

services:
  # Main application
  web:
    image: ghcr.io/alshawwaf/ai-guardrails-demo:latest
    pull_policy: always
    # build disabled: prebuilt + published by .github/workflows/publish-image.yml; uncomment to build locally.
    # build: .
    ports:
      - "${APP_PORT:-9000}:${APP_PORT:-9000}"
    # Lets the default OLLAMA_API_URL (host.docker.internal) reach an Ollama
    # running on the host, on Linux as well as Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Application
      - APP_PORT=${APP_PORT:-9000}
      - LOGS_DIR=${LOGS_DIR:-logs}
      - LOG_FILENAME=${LOG_FILENAME:-application.log}
      - HF_HOME=/app/models_cache
      # Debug mode only with FLASK_DEBUG=1/true. Never on a shared host.
      - FLASK_DEBUG=${FLASK_DEBUG:-0}

      # Sign-in and secrets at rest (see .env.example for how to generate them).
      # Unset FLASK_SECRET_KEY / SETTINGS_ENCRYPTION_KEY: the app generates
      # instance/.flask_secret and instance/.settings_key on the ./instance volume.
      - FLASK_SECRET_KEY
      - SETTINGS_ENCRYPTION_KEY
      - DEFAULT_ADMIN_EMAIL
      - DEFAULT_ADMIN_PASSWORD
      - DEFAULT_ADMIN_PASSWORD_HASH
      # true when users reach the app over HTTPS (for example nginx with TLS)
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      # Proxies whose X-Forwarded-For is trusted. 0 here: users reach port 9000
      # directly. docker-compose.prod.yml sets 1 (nginx) and publishes the port
      # on loopback only. Set it yourself only for your own proxy in front of
      # this stack, and only if nothing else can reach the app port.
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-0}

      # API Keys (from .env; the Settings page overrides them)
      - DEMO_API_KEY
      - DEMO_PROJECT_ID
      - DEMO_API_URL
      - LAKERA_API_KEY
      - LAKERA_PROJECT_ID
      - LAKERA_API_URL=${LAKERA_API_URL:-https://api.lakera.ai/v2/guard}
      - OPENAI_API_KEY
      - OPENAI_API_URL=${OPENAI_API_URL:-https://api.openai.com/v1/chat/completions}
      - ANTHROPIC_API_KEY
      - AZURE_OPENAI_API_KEY
      - AZURE_OPENAI_ENDPOINT
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt-4o-mini-2024-07-18}
      - GEMINI_API_KEY
      - AZURE_CONTENT_SAFETY_KEY
      - AZURE_CONTENT_SAFETY_ENDPOINT

      # Ollama (local LLM). Point OLLAMA_API_URL at your Ollama host. The
      # recommended target model is uncensored on purpose (see .env.example).
      - OLLAMA_API_URL=${OLLAMA_API_URL:-http://host.docker.internal:11434}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-300}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-richardyoung/mythos-9b-unhinged-abliterated:latest}

      # Playground default LLM (used when the browser has no saved choice)
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-ollama}
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-richardyoung/mythos-9b-unhinged-abliterated:latest}

      # CORS for /api/*: off unless explicit origins are listed ("*" is ignored)
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Optional public origin(s) for the same-origin check (see .env.example)
      - APP_ORIGIN

      # Rate Limiting (using Redis)
      - RATE_LIMIT_DAILY=${RATE_LIMIT_DAILY:-1000000}
      - RATE_LIMIT_HOURLY=${RATE_LIMIT_HOURLY:-100000}
      - RATE_LIMIT_STORAGE=redis://redis:6379/0

      # Gateway Mode: run logs, reports and rollback points (no secrets).
      # A path inside the container; unset means /app/logs/aiguard (./logs/aiguard
      # on the host through the ./logs volume below).
      - AIGUARD_HOME
      # The Docker host's IP as the gateway sees it (bridge networking hides the
      # demo computer's address); used for the demo rule's scope and log matching.
      - AIGUARD_LOCAL_IP

      # Gunicorn: only used if scripts/start_production.sh is switched to gunicorn
      # (the image runs "python app.py"). Gateway Mode needs ONE worker; use
      # threads for concurrency (gunicorn -w 1 --threads 8).
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-1}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-8}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-600}
      - GUNICORN_BIND=0.0.0.0:${APP_PORT:-9000}

    volumes:
      - ./:/app
      - ./instance:/app/instance
      - ./logs:/app/logs
      - ./data:/app/data
      - ./backups:/app/backups
      - ./models_cache:/app/models_cache

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - guardrails-network

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${APP_PORT:-9000}/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

    # docker stop: SIGTERM, then SIGKILL after the grace period. On SIGTERM Gateway
    # Mode gives a running publish/install up to 8 s, then discards what is still
    # unpublished and logs out of the management server; 15 s leaves room for that.
    # init: a small init process as PID 1 forwards the signal and reaps children.
    stop_grace_period: 15s
    init: true

    labels:
      - "com.aiguardrails.demo=true"
      - "com.aiguardrails.service=web"

  # Redis for distributed rate limiting. No password: published on this host's
  # loopback only. Remove the 127.0.0.1 prefix only on a trusted network.
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - guardrails-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    labels:
      - "com.aiguardrails.demo=true"
      - "com.aiguardrails.service=redis"

  # Redis Commander - Web UI for Redis. It has no sign-in, so it is published on
  # this host's loopback only (open http://localhost:8082 on the Docker host).
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "127.0.0.1:8082:8081"
    networks:
      - guardrails-network
    depends_on:
      - redis
    restart: unless-stopped
    labels:
      - "com.aiguardrails.demo=true"
      - "com.aiguardrails.service=redis-ui"

  # nginx and backup: see docker-compose.prod.yml.

networks:
  guardrails-network:
    driver: bridge
    name: guardrails-network

volumes:
  redis-data:
    name: ai-guardrails-demo-redis-data
