# Reverse proxy for the production stack:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d    (make prod)
#
# Serves plain HTTP on port 80. For HTTPS, put the certificate and key in
# nginx/ssl/ (git and the image ignore that folder), enable the TLS server
# block at the end of this file, and set SESSION_COOKIE_SECURE=true in .env.
#
# Client address: docker-compose.prod.yml makes the app trust exactly one proxy
# (TRUSTED_PROXY_HOPS=1) and publishes the app port on loopback only. The app
# then uses the last X-Forwarded-For entry, the one nginx appends, so the
# sign-in limit counts each client separately. With one trusted hop the app
# also believes X-Forwarded-Proto, -Host and -Port, so every location that
# proxies to the app sets them itself; a value a client sent would otherwise
# pass through unchanged:
#   X-Forwarded-For   $proxy_add_x_forwarded_for (appends the client address)
#   X-Forwarded-Proto $scheme
#   X-Forwarded-Host  $http_host: the host AND port the browser used. The app's
#                     same-origin check compares scheme, host and port exactly,
#                     so this still works when port 80 is published elsewhere.
#   X-Forwarded-Port  "" (removed: the port is in X-Forwarded-Host)
# scripts/check_deploy_config.py (make check-deploy, CI) checks this.
#
# CORS is decided by the app (CORS_ORIGINS, off by default). Do not add
# Access-Control-* headers here: they would override the app's policy and a
# second Access-Control-Allow-Origin header breaks real CORS callers.

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    upstream demo_backend {
        # One app process: Gateway Mode keeps sessions in its memory.
        server web:9000;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # Gateway Mode JSON API (defense in depth: the app itself allows 10 connect, domain,
    # key check and apply requests per minute per user and client). The console polls a
    # running job every second and the log every 2 seconds, so this stays well above that.
    limit_req_zone $binary_remote_addr zone=gateway_api:10m rate=5r/s;

    server {
        listen 80;
        server_name _;

        # Same as the app's default MAX_CONTENT_LENGTH (2 MB).
        client_max_body_size 2m;

        # Security headers. add_header inside a location replaces these, so the
        # locations below do not use add_header.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Logging
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Health check endpoint (bypass rate limiting)
        location /health {
            proxy_pass http://demo_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
        }

        # API endpoints with rate limiting
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://demo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";

            # Timeouts for LLM operations
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Gateway Mode JSON API, rate limited (see gateway_api above). A management
        # login, a prompt sent through the gateway or a log lookup can take tens of
        # seconds; publish and install run as background jobs that the page polls.
        location /gateway/api/ {
            limit_req zone=gateway_api burst=30 nodelay;
            limit_req_status 429;

            proxy_pass http://demo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Gateway Mode pages (the console itself).
        location /gateway/ {
            proxy_pass http://demo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # All other traffic
        location / {
            proxy_pass http://demo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # HTTPS (optional). Needs nginx/ssl/server.crt and nginx/ssl/server.key
    # (mounted at /etc/nginx/ssl). TLS 1.2 and 1.3 only. To send plain HTTP
    # users to HTTPS, replace the locations in the port 80 server above with:
    #     location / { return 301 https://$host$request_uri; }
    #
    # server {
    #     listen 443 ssl;
    #     server_name _;
    #
    #     ssl_certificate     /etc/nginx/ssl/server.crt;
    #     ssl_certificate_key /etc/nginx/ssl/server.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache   shared:SSL:10m;
    #
    #     client_max_body_size 2m;
    #
    #     add_header Strict-Transport-Security "max-age=31536000" always;
    #     add_header X-Frame-Options "SAMEORIGIN" always;
    #     add_header X-Content-Type-Options "nosniff" always;
    #
    #     location /health {
    #         proxy_pass http://demo_backend/health;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_set_header X-Forwarded-Host $http_host;
    #         proxy_set_header X-Forwarded-Port "";
    #     }
    #     location /api/ {
    #         limit_req zone=api_limit burst=20 nodelay;
    #         proxy_pass http://demo_backend;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_set_header X-Forwarded-Host $http_host;
    #         proxy_set_header X-Forwarded-Port "";
    #         proxy_read_timeout 300s;
    #         proxy_send_timeout 300s;
    #     }
    #     location /gateway/api/ {
    #         limit_req zone=gateway_api burst=30 nodelay;
    #         limit_req_status 429;
    #         proxy_pass http://demo_backend;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
